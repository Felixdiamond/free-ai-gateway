[project]
name = "free-ai-gateway"
version = "1.0.0"
description = "Unified API gateway for free AI providers (ChatGPT, Gemini, Grok)"
requires-python = ">=3.10"
dependencies = [
    "nodriver>=0.36",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "black",
    "isort",
]
